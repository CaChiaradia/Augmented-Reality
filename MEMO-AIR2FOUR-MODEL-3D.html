<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIR2FOUR 3D Model</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      .title {
        margin-top: 20px;
        color: black;
        font-size: 24px;
        text-align: center;
        background: rgba(255, 255, 255, 0.8);
        padding: 10px 20px;
        border-radius: 5px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 2;
      }

      .logo-Air2-line {
        position: absolute;
        top: 90px;
        width: 100%;
        height: 15%;
        background-image: url("https://memolocks.com/wp-content/uploads/2024/08/aie2line-logo.svg");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        z-index: 1;
      }
      .icon {
        position: absolute;
        top: 210px;
        width: 100%;
        height: 8%;
        background-image: url("https://memo-international.github.io/Augmented-Reality/3d-modeling.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        z-index: 1;
      }

      /* Pop-up Modal Styles */
      .popup { 
        position: fixed;
        top: 45%;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        z-index: 3;
        text-align: center;
        display: block; /* Initially visible */
      }

      .logo-Memo {
        position: absolute;
        bottom: 60px;
        width: 100%;
        height: 100%;
        background-image: url("https://memolocks.com/wp-content/uploads/2024/07/favicon.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        z-index: 1;
      }

      .logo-link {
        position: absolute;
        width: 100%;
        height: 15%;
      }

      a-scene {
        flex-grow: 1;
        background-color: white;
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <!-- Title -->
    <div class="title">AIR2FOUR 3D Model</div>

    <!-- Logo -->
    <div class="logo-Air2-line"></div>
    <div class="icon"> </div>

    <!-- Pop-up Modal -->
    <div class="popup" id="popup">
      <div>
        Interact with the 3D Object:
        <br />Mobile: Move your device 360°. / Touch: Use gestures to rotate. /
        Desktop: Use a mouse or touchpad.
      </div>
    </div>

    <!-- Info Icon -->
    <div class="info-icon"></div>

    <!-- Logo -->
    <a
      href="https://memolocks.com/en/"
      class="logo-link"
      style="bottom: 50px"
      target="_blank"
      title="Visit MemoLocks website"
    >
      <div class="logo-Memo"></div>
    </a>

    <!-- A-Frame Scene -->
    <a-scene vr-mode-ui="enable: false;">
      <!-- Load the 3D model -->
      <a-assets>
        <a-asset-item
          id="testModel"
          src="https://memo-international.github.io/Augmented-Reality/air2four.glb"
        ></a-asset-item>
      </a-assets>

      <!-- Display the 3D model -->
      <a-entity
        gltf-model="#testModel"
        scale="40 40 40"
        position="0 -1.5 -7"
        play-all-model-animations=""
        look-controls
      ></a-entity>

      <!-- Camera with motion controls -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Wait for the page to load
      window.onload = function () {
        const textElement = document.getElementById("popup");

        // Set a timeout to hide the pop-up after 5 seconds
        setTimeout(() => {
          textElement.style.display = "none"; // Hide the pop-up after 5 seconds
        }, 5000); // 5000ms = 5 seconds
      };
    </script>
  </body>
</html>
