<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página da Empresa - AIR2FOUR 3D Model</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Cabeçalho */
      header {
        background-color: #ddc39a; /* Cor do cabeçalho */
        padding: 20px;
        text-align: center;
      }

      header img {
        width: 100px; /* Ajuste o tamanho do logotipo conforme necessário */
      }

      h1 {
        font-size: 5vw; /* Responsividade do título */
        color: #fff;
        margin-top: 10px;
      }

      .logo-Air2-line {
        position: absolute;
        top: 520px;
        width: 100%;
        height: 15%;
        background-image: url("https://memolocks.com/wp-content/uploads/2024/08/aie2line-logo.svg");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        z-index: 1;
      }

      .icon {
        position: absolute;
        top: 170px;
        width: 100%;
        height: 8%;
        background-image: url("https://memo-international.github.io/Augmented-Reality/3d-modeling.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        z-index: 1;
      }

      /* Pop-up Modal Styles */
      .popup {
        position: fixed;
        top: 45%;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        z-index: 3;
        text-align: center;
        display: block; /* Initially visible */
      }

      /* Rodapé */
      footer {
        background-color: #333;
        color: white;
        padding: 10px;
        position: fixed;
        width: 100%;
        bottom: 0;
        text-align: center;
      }
      footer img {
        width: 50px;
      }
      footer p {
        margin: 0;
      }

      .logo-link {
        position: absolute;
        width: 100%;
        height: 15%;
      }

      a-scene {
        flex-grow: 1;
        background-color: white;
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <!-- Cabeçalho -->
    <header>
      <a href="https://memolocks.com/en/" target="_blank">
        <img
          src="https://memolocks.com/wp-content/uploads/2025/01/Logo-Memo-Black.svg"
        />
      </a>
      <h1>AR2FOUR 3D Model</h1>
    </header>

    <!-- Logo -->
    <div class="logo-Air2-line"></div>
    <div class="icon"></div>

    <!-- Pop-up Modal -->
    <div class="popup" id="popup">
           <div>
        Interact with the 3D Model:
        <br />Mobile: Move your device 360°. / Touch: Use gestures to rotate. /
        Desktop: Use mouse or touchpad.
      </div>
    </div>

    <!-- Info Icon -->
    <div class="info-icon"></div>

    <!-- Logo -->
    <a
      href="https://memolocks.com/en/"
      class="logo-link"
      style="bottom: 50px"
      target="_blank"
      title="Visit MemoLocks"
    >
      <div class="logo-Memo"></div>
    </a>

    <!-- A-Frame Scene -->
    <a-scene vr-mode-ui="enable: false;">
      <!-- Carregar o modelo 3D -->
      <a-assets>
        <a-asset-item
          id="testModel"
          src="https://memo-international.github.io/Augmented-Reality/air2four.glb"
        ></a-asset-item>
      </a-assets>

      <!-- Exibir o modelo 3D -->
      <a-entity
        gltf-model="#testModel"
        scale="40 40 40"
        position="0 -2.5 -7"
        play-all-model-animations=""
        look-controls
      ></a-entity>

      <!-- Câmera com controles de movimento -->
      <a-entity camera></a-entity>
    </a-scene>

    <!-- Rodapé -->
    <footer>
      <p>© 2024 MEMO International Ltd. All rights reserved.</p>
    </footer>

    <script>
      // Esperar a página carregar
      window.onload = function () {
        const textElement = document.getElementById("popup");

        // Definir um tempo limite para esconder o pop-up após 5 segundos
        setTimeout(() => {
          textElement.style.display = "none"; // Esconder o pop-up após 5 segundos
        }, 5000); // 5000ms = 5 segundos
      };
    </script>
  </body>
</html>
